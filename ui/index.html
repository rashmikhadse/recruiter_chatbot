<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding -->
  <meta charset="UTF-8" />

  <!-- Responsive layout -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Browser tab title -->
  <title>Recruiter Assistant</title>

  <!-- Favicon icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" href="favicon.ico" />

  <!-- Tailwind CDN (optional utilities, not required for logic) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Root container -->
  <div class="app-container">

    <!-- ================= LEFT SIDEBAR ================= -->
    <aside class="sidebar">

      <!-- New chat button -->
      <button class="new-chat-btn">
        + New Chat
      </button>

      <!-- Chat history list (static for now) -->
      <div class="chat-history">
        <div class="chat-history-item">Data Analyst – UK</div>
        <div class="chat-history-item">Python Backend Engineer</div>
      </div>

    </aside>

    <!-- ================= CHAT AREA ================= -->
    <main class="chat-area">

      <!-- Header (always visible) -->
      <header class="chat-header">
        <span class="chat-title">Recruiter Assistant</span>
      </header>

      <!-- Messages -->
      <section id="chat-messages" class="chat-messages">
        <!-- Messages injected by app.js -->
      </section>

      <!-- Input bar -->
      <footer class="chat-input-container">

        <!-- User input -->
        <textarea
          id="chat-input"
          class="chat-input"
          placeholder="Type your message..."
          rows="1"
        ></textarea>

        <!-- Send button -->
        <button id="send-button" class="send-button">
          Send
        </button>

      </footer>

    </main>

  </div>

  <!-- App logic -->
  <script src="app.js"></script>

</body>
</html>
