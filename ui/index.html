<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Recruiter Assistant</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/ui/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/ui/favicon-16x16.png" />
  <link rel="icon" href="/ui/favicon.ico" />

  <!-- Styles -->
  <link rel="stylesheet" href="/ui/styles.css" />
</head>

<body>

  <div class="app-container">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">

      <button class="new-chat-btn">+ New Chat</button>

      <!-- DYNAMIC chat history -->
      <div class="chat-history" id="chat-history"></div>

    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area">

      <header class="chat-header">
        <span class="chat-title">Recruiter Assistant</span>
      </header>

      <section id="chat-messages" class="chat-messages"></section>

      <footer class="chat-input-container">
        <div class="chat-input-capsule">

          <input
            type="file"
            id="file-input"
            accept=".pdf,.doc,.docx"
            style="display: none"
          />

          <button
            class="icon-button"
            id="attach-button"
            title="Attach file"
          >
            +
          </button>

          <textarea
            id="chat-input"
            class="chat-input"
            placeholder="Type your message..."
            rows="1"
          ></textarea>

          <button id="send-button" class="send-icon-button" title="Send">
            ↑
          </button>

        </div>
      </footer>

    </main>
  </div>

  <!-- JS (LOAD ONCE, AT END) -->
  <script src="/ui/app.js"></script>

</body>
</html>
